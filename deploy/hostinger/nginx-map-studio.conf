# DBOT Map Studio — nginx on a Hostinger VPS: the site, and the API beside it.
#
# VPS ONLY. On Hostinger's shared, Premium, Business and Cloud plans the web
# server is LiteSpeed and you cannot edit its config — there, the .htaccess at
# the repository root does this job instead, and it does all of it except the
# /api proxy, which those plans cannot host. See docs/HOSTINGER-DEPLOY.md.
#
# INSTALL
#   sudo cp deploy/hostinger/nginx-map-studio.conf \
#           /etc/nginx/sites-available/map-studio
#   sudo ln -s /etc/nginx/sites-available/map-studio /etc/nginx/sites-enabled/
#   sudo nano /etc/nginx/sites-available/map-studio     # set server_name, root
#   sudo nginx -t && sudo systemctl reload nginx
#
# THEN THE CERTIFICATE, which rewrites the listen lines below for you:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com -d www.your-domain.com
#
# Run certbot AFTER this file is in place and nginx has reloaded: it edits the
# server block it finds, and it has to find one.

# ---------------------------------------------------------------------------
# Port 80 — nothing is served here
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Certbot's renewal challenge is the one thing answered over plain HTTP.
    # Without this exception, renewal fails every 60 days and the site expires
    # on a Sunday.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# The site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com www.your-domain.com;

    # certbot --nginx writes ssl_certificate and ssl_certificate_key here.
    # Leave the placeholders; do not hand-edit the paths it adds.

    # Point this at the packaged build, not at the repository root: dist/ is
    # the 5.7 MB the site actually requests, where the checkout is 487 MB of
    # which 473 MB is legacy/ build snapshots.
    #   node tools/build-hostinger.js --no-zip
    root /var/www/map-studio/dist;
    index login.html index.html;

    # Uploads: a project .json import is the largest thing a visitor sends, and
    # the default 1m rejects a map with photo callouts in it with a 413.
    client_max_body_size 25m;

    # -----------------------------------------------------------------------
    # Types nginx would otherwise guess at
    # -----------------------------------------------------------------------
    # mime.types (included by nginx.conf) covers .js, .css, .svg and .woff2.
    # These three it does not know, and each has a visible failure: .geojson
    # and .webmanifest served as octet-stream are refused by fetch(), and a
    # .pbf served as text is decoded as text, so the vector basemap draws
    # nothing while reporting no error.
    types {
        application/geo+json                geojson;
        application/manifest+json           webmanifest;
        application/vnd.mapbox-vector-tile  pbf mvt;
    }

    # -----------------------------------------------------------------------
    # Compression
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/geo+json image/svg+xml;
    # Not .woff2, .png or .pbf: all three are already compressed, and gzipping
    # them spends CPU to add bytes.

    # -----------------------------------------------------------------------
    # Caching — the rule that matters most
    # -----------------------------------------------------------------------
    # THE HTML MUST NOT BE CACHED. Every script and stylesheet is requested as
    # `?v=6.0229`, so a release busts its own assets — but nothing busts the
    # HTML that names them. A browser holding yesterday's index.html asks for
    # yesterday's asset versions and gets them, consistently, from cache: a
    # page that looks entirely correct and is missing whatever shipped last.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Everything else is addressed by a URL that changes when its content does.
    location ~* \.(js|mjs|css|woff2?|ttf|png|jpe?g|gif|svg|webp|ico|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Security headers
    # -----------------------------------------------------------------------
    # `always` so they are sent on error responses too — a 404 is a response a
    # browser renders, and it needs nosniff as much as a 200 does.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

    # Deliberately NO Content-Security-Policy and no COEP/COOP. The map loads
    # tiles, fonts, routing, Overpass, Supabase and Google from a list of
    # origins that grows whenever a basemap is added, and a CSP one origin out
    # of date is a blank map with an error only the console shows. COEP would
    # block every tile server that does not send CORP, which is most of them.
    # Adding either needs a pass with the network panel open, not a line from a
    # hardening checklist.

    # -----------------------------------------------------------------------
    # The AI reports backend, same origin
    # -----------------------------------------------------------------------
    # Proxying it here rather than giving it its own subdomain means the
    # browser makes same-origin requests and CORS never enters the picture.
    # If you do this, set AI_FUNCTIONS_BASE_URL in js/config.js to '/api' — and
    # note the backend then also needs ALLOWED_ORIGIN set to this site, because
    # it still checks the Origin header on requests that carry one.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;   # the trailing / strips /api
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A report is researched across several model calls before it answers.
        # The default 60s proxy_read_timeout cuts that off and the browser sees
        # a 504 for work the backend is still doing and will finish.
        proxy_connect_timeout 10s;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;

        # The status endpoint is polled; buffering delays each answer for no
        # gain on a response measured in bytes.
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # What must never be served
    # -----------------------------------------------------------------------
    # Only reachable if root points at the checkout instead of dist/. Cheap
    # insurance against exactly that mistake.
    location ~ ^/(server|tools|diagnostics|sql|docs|test|legacy)/ { return 404; }
    location ~ /\.(git|env|claude|agents) { return 404; }
    location ~ \.(env|sql|log|cjs|md)$    { return 404; }

    # -----------------------------------------------------------------------
    # Errors
    # -----------------------------------------------------------------------
    error_page 404 /404.html;
    location = /404.html { internal; }

    # NOT `try_files $uri $uri/ /index.html`. This is a set of real .html files,
    # not a single-page app: that line would answer a mistyped script path with
    # HTML, and the browser would report a syntax error in a file that does not
    # exist rather than a missing file.
    location / { try_files $uri $uri/ =404; }
}
