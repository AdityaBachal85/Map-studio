; DBOT Map Studio — AI reports backend under Supervisor, on a Hostinger VPS.
;
; VPS ONLY. Hostinger's shared, Premium, Business and Cloud plans do not run
; Node, and nothing in this file applies to them — there, leave the backend on
; Render (it is already deployed and AI_FUNCTIONS_BASE_URL already points at
; it) or leave the feature off. See docs/HOSTINGER-DEPLOY.md.
;
; INSTALL
;   sudo apt update && sudo apt install -y supervisor
;   sudo cp deploy/hostinger/supervisor-map-studio-ai.conf \
;           /etc/supervisor/conf.d/map-studio-ai.conf
;   sudo nano /etc/supervisor/conf.d/map-studio-ai.conf     # fill in the secrets
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status map-studio-ai
;
; The paths below assume the repository is at /var/www/map-studio and the
; service runs as the `mapstudio` user. Change both together or neither.

[program:map-studio-ai]

; `npm start` is deliberately not used. npm forks node as a child, so
; Supervisor's stop signal reaches npm and the node process is orphaned —
; which looks like a successful restart and leaves the old one holding the
; port, so the new one exits and Supervisor restarts it forever. Exec node
; directly and the signal reaches the process that has to receive it.
command=/usr/bin/node src/server.js
directory=/var/www/map-studio/server
user=mapstudio

; Restart on any exit, including a clean one: a clean exit here means the
; process decided to stop, and this service has no reason to.
autostart=true
autorestart=true

; A process that dies five times inside a minute is not going to be fixed by a
; sixth start — it is a missing DATABASE_URL or a port already in use, and
; hammering it only buries the first error under a hundred copies.
startretries=5
startsecs=10

; SIGTERM is what server.js listens for to drain in-flight requests. The
; default SIGTERM is right; the wait is raised because the default 10s can cut
; a report generation short.
stopsignal=TERM
stopwaitsecs=30

; Kill the whole process group. Without this, a child spawned by the server
; survives a stop and keeps the port.
stopasgroup=true
killasgroup=true

; One file, rotated by Supervisor itself, with stderr folded into it so a crash
; and the requests leading up to it read in order. Two files means comparing
; timestamps across them to reconstruct one event.
redirect_stderr=true
stdout_logfile=/var/log/map-studio/ai-backend.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; The log directory must exist and be writable before the first start:
;   sudo mkdir -p /var/log/map-studio && sudo chown mapstudio /var/log/map-studio

; ---------------------------------------------------------------------------
; Environment
; ---------------------------------------------------------------------------
;
; THESE ARE SECRETS AND THIS FILE IS IN A GIT REPOSITORY. Fill them in on the
; server, in /etc/supervisor/conf.d/, never in the copy under version control.
; Anything pasted here and committed is published the moment the branch is
; pushed — and a leaked Gemini key is billed to you until it is revoked.
;
; The alternative, and the better one if more than one service needs them: put
; them in /etc/map-studio.env (chmod 600, owned by root) and reference it from
; a systemd unit instead — see map-studio-ai.service in this directory.
;
; PORT must match the proxy_pass port in nginx-map-studio.conf.
environment=
    NODE_ENV="production",
    PORT="8080",
    DATABASE_URL="postgres://…",
    GEMINI_API_KEY="…",
    GOOGLE_MAPS_API_KEY="…",
    ALLOWED_ORIGIN="https://your-domain.com",
    PERPLEXITY_API_KEY="",
    GOOGLE_SEARCH_API_KEY="",
    GOOGLE_SEARCH_CX="",
    OPENROUTER_API_KEY=""

; ALLOWED_ORIGIN is the exact origin of the site — scheme and host, no trailing
; slash, no path. With it unset the backend answers any website that asks, and
; the Gemini bill is yours either way. `https://your-domain.com/` and
; `https://your-domain.com/studio` both match nothing, and the failure looks
; like a CORS error in the browser rather than a configuration mistake here.
