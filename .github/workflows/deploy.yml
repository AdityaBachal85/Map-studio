name: Build & Deploy to GitHub Pages

# Builds the Vite single-file bundle (app + export engine) and publishes it to
# GitHub Pages. In repo Settings -> Pages, set "Build and deployment" source
# to "GitHub Actions" (not "Deploy from a branch" -- that mode serves the raw
# source files as static assets with no build step, and the app's ES modules
# use bare specifiers like `import L from 'leaflet'` that only resolve after
# Vite bundles them, so a branch-deploy shows a blank page).
on:
  push:
    branches: [main, Map-Studio_V5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
